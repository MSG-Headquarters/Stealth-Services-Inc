<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#F43F5E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.1">
    <line x1="128" y1="0" x2="128" y2="512" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#8B5CF6" stroke-width="1"/>
  </g>
  
  <!-- Glow effect behind text -->
  <ellipse cx="256" cy="256" rx="140" ry="80" fill="#8B5CF6" opacity="0.15" filter="blur(30px)"/>
  
  <!-- AXIS Text -->
  <text x="256" y="240" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="120" 
        font-weight="800" 
        fill="url(#prismGrad)" 
        text-anchor="middle" 
        letter-spacing="8">
    AXIS
  </text>
  
  <!-- FIT Text -->
  <text x="256" y="320" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="56" 
        font-weight="600" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="16"
        opacity="0.9">
    FIT
  </text>
  
  <!-- Accent line -->
  <rect x="156" y="340" width="200" height="4" rx="2" fill="url(#glowGrad)"/>
  
  <!-- Dumbbell icon at bottom -->
  <g transform="translate(256, 420)" fill="#ffffff" opacity="0.6">
    <rect x="-60" y="-8" width="20" height="16" rx="3"/>
    <rect x="40" y="-8" width="20" height="16" rx="3"/>
    <rect x="-40" y="-4" width="80" height="8" rx="2"/>
    <rect x="-70" y="-12" width="10" height="24" rx="2"/>
    <rect x="60" y="-12" width="10" height="24" rx="2"/>
  </g>
</svg>
