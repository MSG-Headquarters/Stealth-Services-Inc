<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.1">
    <line x1="128" y1="0" x2="128" y2="512" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#8B5CF6" stroke-width="1"/>
  </g>
  
  <!-- Glow effect -->
  <ellipse cx="256" cy="240" rx="120" ry="70" fill="#8B5CF6" opacity="0.15" filter="blur(30px)"/>
  
  <!-- i prefix -->
  <text x="145" y="260" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="100" 
        font-weight="300" 
        font-style="italic"
        fill="#06B6D4" 
        text-anchor="middle">
    i
  </text>
  
  <!-- AXIS Text -->
  <text x="295" y="260" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="100" 
        font-weight="800" 
        fill="url(#prismGrad)" 
        text-anchor="middle" 
        letter-spacing="4">
    AXIS
  </text>
  
  <!-- HUB Text -->
  <text x="256" y="340" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="48" 
        font-weight="600" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="12"
        opacity="0.9">
    HUB
  </text>
  
  <!-- Accent line -->
  <rect x="156" y="360" width="200" height="4" rx="2" fill="url(#glowGrad)"/>
  
  <!-- Command center icon -->
  <g transform="translate(256, 430)" fill="#ffffff" opacity="0.5">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="3"/>
    <!-- Orbital rings -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
    <!-- Dots -->
    <circle cx="-30" cy="0" r="4"/>
    <circle cx="30" cy="0" r="4"/>
    <circle cx="0" cy="-10" r="4"/>
  </g>
</svg>
