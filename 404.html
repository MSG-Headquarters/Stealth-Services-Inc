<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | SSI</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --obsidian: #0D0D0D; --tactical-green: #00FF88; --electric-violet: #9945FF; --ghost-white: #E8E8E8; --muted-white: #B8B8B8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Exo 2', sans-serif; background: var(--obsidian); color: var(--ghost-white); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 2rem; }
        .code { font-family: 'Rajdhani', sans-serif; font-size: 8rem; font-weight: 700; background: linear-gradient(90deg, var(--tactical-green), var(--electric-violet)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 1rem; }
        .message { font-size: 1.5rem; color: var(--muted-white); margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 1rem 2.5rem; background: linear-gradient(135deg, var(--tactical-green), var(--electric-violet)); color: var(--obsidian); font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; border-radius: 8px; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,255,136,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <p class="message">Target not found. Return to base.</p>
        <a href="/" class="btn">Return Home</a>
    </div>
    <script src="js/sunday-auth.js"></script>
    <script>
        // Check auth even on 404
        SundayAuth.init({ appId: 'ssi', requireAuth: false });
    </script>
</body>
</html>
