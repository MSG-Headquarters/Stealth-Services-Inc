# Deploy config for the `ssi` Worker — ends seven months of dashboard drift.
#
# ── WHY THIS FILE EXISTS ──────────────────────────────────────────────────────
#
# Every version of this Worker reads *Manually deployed · Dashboard*. Nobody can
# say what is in production without capturing it, which is exactly what
# capture/production-2026-08-30 had to do — a whole branch of work to answer a
# question a repo-driven deploy answers for free.
#
# With this file, `wrangler deploy` from a clean checkout makes the repo the
# source of truth. The next person to ask "what is live" reads git log.
#
# ── WHAT IT NEEDS BEFORE IT CAN RUN ───────────────────────────────────────────
#
# A Cloudflare API token scoped to THIS Worker and nothing else — Koda's hands
# to create, and deliberately not account-wide:
#
#   Account → Workers Scripts → Edit
#   Account → Workers KV Storage → (not needed; there are no bindings)
#   Zone    → (not needed; no route changes are made from here)
#
# Then:  CLOUDFLARE_API_TOKEN=… npx wrangler deploy
#
# ⚠️ THE FIRST DEPLOY REPLACES A HAND-UPLOADED BUNDLE THAT NOBODY HAS A COPY OF
# BEYOND THE CAPTURE. The capture is best-effort by its own admission — an
# unlinked file absent from the probe list would not be in this repo, and
# deploying would delete it. If anything on the live site is not in this
# branch, it goes when this ships. That is the cost of ending the drift, and it
# should be a decision rather than a surprise.
#
# ── SETTINGS THIS FILE DOES NOT TOUCH ─────────────────────────────────────────
#
# Custom domains, routes, and the workers.dev subdomain stay as the dashboard
# has them. `workers_dev` is set false below because leaving the second door
# open is §6's item 2 — but VERIFY IN THE DASHBOARD after the first deploy
# rather than trusting this line, since the Worker predates the config.

name = "ssi"
compatibility_date = "2026-09-01"

# ⚠️ THESE TWO KEYS MUST STAY ABOVE `[assets]`, AND THAT IS NOT A STYLE POINT.
#
# In TOML every key after a table header belongs to THAT TABLE. The first
# version of this file put `workers_dev = false` at the bottom, so it parsed as
# `assets.workers_dev` — a key wrangler does not read — and the top-level
# setting silently kept its default. The first deploy therefore ENABLED the
# workers.dev route, which is the exact second door §6 item 2 exists to close.
# Wrangler said so in a warning nobody would have read as "your config did not
# take effect".
#
# §6 item 2: `ssi.real-elite-ck.workers.dev` served the same content on a
# hostname nobody audits — a second front door to keep in step forever. Off.
workers_dev = false

# And the preview URLs the same deploy turned on by default, for the same
# reason: another hostname serving this content that nobody is watching.
preview_urls = false

# No Worker script yet — this is a pure static asset bundle, exactly as the
# capture found it. Phase B (real Sign in with Sunday) is what introduces a
# `main` entry point and the OIDC callback route.
#
# ⚠️ NEVER POINT THIS AT THE REPO ROOT. IT WAS, AND IT LEAKED.
#
# `directory = "./"` plus an `.assetsignore` denylist uploaded the entire
# repository to a public website on the first deploy — .git/objects, .git/refs,
# .git/logs — because the ignore file forgot `.git/`. Correcting the list did
# not help: wrangler still reported "Read 243 files" whatever the ignore said,
# so with the root as the asset directory the denylist was not being honoured
# at all.
#
# `dist/` is built by tools/build-bundle.mjs from `git ls-files` — an ALLOWLIST
# derived from version control, minus tooling. Nothing untracked can reach the
# edge: not .git, not .wrangler, not an editor swap file, not a .env somebody
# drops in the root next month. The script refuses to build if the count exceeds
# 60 files, and prints every file it ships.
#
# Deploy is therefore two steps, always:
#     node tools/build-bundle.mjs && npx wrangler deploy
[assets]
directory = "./dist"
